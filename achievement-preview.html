*{box-sizing:border-box}body{margin:0;background:#10191d;color:#ece9d8;font:16px system-ui,sans-serif;min-height:100vh}main{max-width:980px;margin:4vh auto;padding:clamp(12px,3vw,32px)}header,.case{border:1px solid #566068;box-shadow:inset 0 2px #96a298,0 5px 0 #080f12;background:#263337}header{position:relative;overflow:hidden;height:188px;background:#142d34}canvas{position:absolute;width:100%;height:100%;image-rendering:pixelated;object-fit:cover;object-position:right center}header div{position:absolute;inset:0;padding:34px;background:linear-gradient(90deg,#142326 5%,#142326df 33%,transparent 72%)}small,.serial,.tier,nav button,.tag,footer{font: bold 12px/1.5 Consolas,monospace;letter-spacing:.09em;text-transform:uppercase}small{color:#f3a85f}h1,h2{font-family:Impact,'Arial Narrow',sans-serif;text-transform:uppercase;font-weight:800;letter-spacing:.025em}h1{margin:8px 0 4px;font-size:clamp(35px,6vw,62px);line-height:1}header p{margin:8px 0;color:#c2cac2}.case{margin-top:16px;padding:16px}nav{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}button{color:inherit;background:#18272a;border:1px solid #5b6969;padding:9px 13px;cursor:pointer}button:focus-visible{outline:3px solid white;outline-offset:-3px}nav button[aria-pressed=true]{background:#f0af64;color:#192326;border-color:#ffda9c}.layout{display:grid;grid-template-columns:minmax(230px,1fr) 1.3fr;gap:14px}.list{max-height:340px;overflow:auto;scrollbar-color:#6d7974 #172427}.list button{display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-height:46px;border:0;border-bottom:1px solid #344548}.list button[aria-pressed=true]{background:#344949;box-shadow:inset 4px 0 var(--accent)}.serial{color:#acb7ad}.plate{background:radial-gradient(ellipse at top right,#36494a,#1a292c 70%);border:1px solid #526265;padding:24px;position:relative;display:flex;flex-direction:column;align-items:flex-start}.plate:after{content:"";position:absolute;right:9px;top:9px;border:2px solid #75807a;border-radius:50%;width:4px;height:4px}.tier{color:var(--accent)}.badge{width:56px;height:60px;background:var(--accent);clip-path:polygon(0 0,100% 0,100% 66%,50% 100%,0 66%);display:grid;place-items:center;margin-bottom:12px;color:#18272a;font:900 24px Consolas,monospace;border-top:5px double #2c3736}.plate h2{font-size:30px;margin:8px 0 0}.plate p{line-height:1.5;max-width:38ch;margin:8px 0 20px}.tag{color:#bbc8bf}.plate button{margin-top:auto}.toast{position:fixed;right:clamp(12px,4vw,64px);bottom:5vh;display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:12px;max-width:calc(100vw - 24px);padding:12px 14px;background:linear-gradient(110deg,#33464a,#17282c);border:2px solid #798983;border-left:5px solid var(--accent);box-shadow:inset 0 1px #acb6aa,3px 4px #0c1316;animation:surface .18s ease-out}.toast[hidden]{display:none}.toast .badge{width:40px;height:43px;font-size:16px;margin:0}.toast strong{display:block;font-size:19px}.toast button{padding:5px 9px}.toast .tier{font-size:10px}footer{margin-top:12px;color:#adb9ad;font-size:10px}@keyframes surface{from{transform:translateY(12px);opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}@media(max-width:620px){main{margin:0 auto}.layout{grid-template-columns:1fr}.list{max-height:165px}.plate{min-height:235px}header div{padding:22px}header{height:145px}}

<main><header><canvas width="480" height="100" aria-hidden="true"></canvas><div><small>In the Hunt</small><h1>Service record</h1><p>Achievement archive</p></div></header><section class="case"><nav aria-label="Difficulty"></nav><div class="layout"><div class="list" aria-label="Achievements"></div><article class="plate"><div class="badge" aria-hidden="true"></div><div class="tier"></div><h2></h2><span class="tag"></span><p></p><button id="preview">Preview unlock</button></article></div></section><footer>Design preview · local progress is unaffected</footer></main><aside class="toast" hidden><div class="badge" aria-hidden="true"></div><div role="status"><span class="tier"></span><strong></strong></div><button aria-label="Dismiss notification">×</button></aside>

ut losing a life.","tier":"Difficult"},{"id":"salvage_crew","name":"Salvage Crew","mode":"Arcade solo","description":"Defeat three distinct bosses with a secondary-weapon finishing hit in one run.","tier":"Difficult"},{"id":"double_hull","name":"Double Hull","mode":"Arcade co-op","description":"Start together and clear three consecutive stages with neither player losing a submarine.","tier":"Difficult"},{"id":"full_manifest","name":"Full Manifest","mode":"Score Attack","description":"Finish the entire campaign in ranked Score Attack.","tier":"Difficult"},{"id":"reserve_fleet","name":"Fleet in Reserve","mode":"Boss Rush","description":"Clear a ranked Boss Rush with at most one life lost.","tier":"Difficult"},{"id":"pressure_hull","name":"Pressure Hull","mode":"Boss Rush","description":"Clear a ranked Boss Rush without losing a life.","tier":"Extreme"},{"id":"silent_running","name":"Silent Running","mode":"Arcade solo","description":"Clear the campaign on Normal or Hard with default starting lives, without losing a submarine.","tier":"Extreme"},{"id":"abyssal_command","name":"Abyssal Command","mode":"Arcade solo","description":"Complete 10 solo one-credit clears on Hard with default starting lives.","tier":"Extreme"},{"id":"torpedo_school","name":"Torpedo School","mode":"Arcade solo","description":"Finish 15 solo one-credit campaigns on Normal or Hard, scoring kills with Power, Wave and Spread torpedoes in each run.","tier":"Extreme"},{"id":"perfect_charts","name":"Perfect Charts","mode":"Arcade solo","description":"Clear every campaign stage without losing a life on Hard, three times per stage across solo runs.","tier":"Extreme"},{"id":"convoy_duty","name":"Convoy Duty","mode":"Arcade co-op","description":"Start together and finish five campaigns on Normal or Hard with default lives and no continues by either player.","tier":"Extreme"},{"id":"deep_patrol","name":"Deep Patrol","mode":"Boss Rush","description":"Complete 50 ranked Boss Rush clears, including five without losing a life.","tier":"Extreme"},{"id":"unbroken_line","name":"Unbroken Line","mode":"Boss Rush","description":"Clear three consecutive ranked Boss Rush attempts without losing a life. Quitting or restarting breaks the streak.","tier":"Extreme"},{"id":"victory_ledger","name":"Victory Ledger","mode":"Score Attack","description":"Complete 25 full campaigns in ranked Score Attack.","tier":"Extreme"},{"id":"clean_sweep","name":"Clean Sweep","mode":"Score Attack","description":"Complete five ranked Score Attack campaigns without losing a submarine.","tier":"Extreme"}]</script><script>
const catalog=JSON.parse(document.querySelector('#catalog').textContent);
const grades={Easy:['I','#9dc9b5'],Medium:['II','#80c4d8'],Difficult:['III','#edab64'],Extreme:['IV','#faa298']};
const q=s=>document.querySelector(s), list=q('.list'), plate=q('.plate'), toast=q('.toast');
let current, timer;
function decorate(el,a){el.style.setProperty('--accent',grades[a.tier][1]);el.querySelector('.badge').textContent=grades[a.tier][0]}
function select(a,button){current=a;for(const b of list.children)b.setAttribute('aria-pressed',b===button);decorate(plate,a);q('.plate .tier').textContent=a.tier+' commendation';q('h2').textContent=a.name;q('.tag').textContent=a.mode;q('.plate p').textContent=a.description}
function filter(t,tab){for(const b of q('nav').children)b.setAttribute('aria-pressed',b===tab);list.replaceChildren();for(const a of catalog.filter(x=>x.tier===t)){const b=document.createElement('button'),n=document.createElement('span');n.className='serial';n.textContent=String(catalog.indexOf(a)+1).padStart(2,'0');b.append(n,a.name);b.onclick=()=>select(a,b);list.append(b)}list.scrollTop=0;list.firstChild.click()}
for(const t of Object.keys(grades)){const b=document.createElement('button');b.textContent=t+' · '+catalog.filter(a=>a.tier===t).length;b.onclick=()=>filter(t,b);q('nav').append(b)}q('nav button').click();
q('#preview').onclick=()=>{clearTimeout(timer);decorate(toast,current);q('.toast .tier').textContent='Achievement unlocked · '+current.tier;q('.toast strong').textContent=current.name;toast.hidden=false;timer=setTimeout(()=>toast.hidden=true,4500)};
q('.toast button').onclick=()=>{toast.hidden=true;q('#preview').focus()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!toast.hidden)q('.toast button').click();if(['ArrowUp','ArrowDown'].includes(e.key)&&list.contains(document.activeElement)){e.preventDefault();const b=e.key==='ArrowUp'?document.activeElement.previousElementSibling:document.activeElement.nextElementSibling;if(b){b.focus();b.click()}}});
// Original pixel-art submarine and submerged ridge, drawn at cabinet resolution.
const c=q('canvas').getContext('2d');function rect(x,y,w,h,color){c.fillStyle=color;c.fillRect(x,y,w,h)}function poly(points,color){c.fillStyle=color;c.beginPath();points.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.closePath();c.fill()}
for(let y=0;y<100;y++)rect(0,y,480,1,'rgb('+[17-y*.1,63-y*.32,69-y*.31].map(Math.round)+')');
for(let i=0;i<75;i++)rect((i*73)%480,(i*37)%96,1+i%4,1,'#487477');for(let x=0;x<480;x+=3){const y=Math.floor(83+7*Math.sin(x*.05)+5*Math.sin(x*.17));rect(x,y,3,100-y,'#172e32')}
